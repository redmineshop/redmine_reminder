name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Ruby syntax
        run: |
          set -euo pipefail
          count=$(find . -name '*.rb' -not -path './.git/*' | wc -l)
          test "$count" -gt 0
          find . -name '*.rb' -not -path './.git/*' -print0 | xargs -0 -n1 ruby -c
      - name: Locale YAML
        run: |
          ruby -ryaml <<'RUBY'
          Dir["config/locales/*.yml"].each do |path|
            YAML.safe_load_file(path)
            puts "OK #{path}"
          end
          RUBY
      - name: Webhook URL guards
        run: ruby test/webhook_url_test.rb
